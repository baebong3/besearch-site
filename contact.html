<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문의 | 비써치 BeSearch</title>
<meta name="description" content="비써치(BeSearch)는 시장조사·여론조사와 사회과학 연구, 데이터 대시보드 제작을 수행합니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#F7F6F2; --card:#FFFFFF; --ink:#15191E; --ink2:#48515C; --muted:#7B848F;
  --line:#E3E1DA; --acc:#1F5F5B; --acc-s:#DDEBE8; --bar:#2F7F79; --bar-lo:#B9C2C0; --bar-hi:#17504C;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121516; --card:#1A1F20; --ink:#ECEEEE; --ink2:#B4BCBC; --muted:#8A9494;
    --line:#2B3233; --acc:#6FC4BB; --acc-s:#1E3432; --bar:#4FA69D; --bar-lo:#4A5353; --bar-hi:#8FD9D0;}
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.65;word-break:keep-all}
a{color:inherit}
.in{max-width:1080px;margin:0 auto;padding:0 20px}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .in{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:baseline;gap:8px}
.logo b{color:var(--acc)}
.logo small{font-weight:500;font-size:12.5px;color:var(--muted)}
nav{display:flex;gap:4px}
nav a{font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none;padding:8px 10px;border-radius:8px}
nav a{white-space:nowrap}
nav a:hover{background:var(--acc-s);color:var(--acc)}

.hero{padding:76px 0 60px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--acc)}
.hero h1{font-size:clamp(30px,5.2vw,50px);line-height:1.25;letter-spacing:-.035em;font-weight:800;margin:14px 0 18px;text-wrap:balance}
.hero p{font-size:17px;color:var(--ink2);max-width:620px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-block;font-size:15px;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn:hover{filter:brightness(1.06)}

section{padding:56px 0;border-top:1px solid var(--line)}
h2{font-size:26px;letter-spacing:-.03em;font-weight:800;margin-bottom:6px}
.sub{color:var(--ink2);margin-bottom:28px;max-width:640px}

.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.svc div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.svc h3{font-size:17px;font-weight:700;margin-bottom:6px}
.svc p{font-size:14.5px;color:var(--ink2)}
.svc .no{font-size:12px;font-weight:700;color:var(--acc);display:block;margin-bottom:10px}

.proj{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:16px}
.proj-h{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.proj h3{font-size:21px;font-weight:800;letter-spacing:-.02em}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--acc-s);color:var(--acc);white-space:nowrap}
.tag.wait{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.proj>p{color:var(--ink2);font-size:15px;max-width:720px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi em{font-style:normal;font-size:12.5px;color:var(--ink2)}
.charts{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;margin-top:8px}
.ch h4{font-size:14.5px;font-weight:700;margin-bottom:2px}
.ch .cap{font-size:12.5px;color:var(--muted);margin-bottom:8px}
svg{width:100%;height:auto;display:block;overflow:visible}
.grid{stroke:var(--line);stroke-width:1}
.axis{stroke:var(--muted);stroke-width:1}
.tick{font-size:12px;fill:var(--muted);font-family:var(--sans)}
.xl{font-size:12px;fill:var(--ink2);font-family:var(--sans);font-variant-numeric:tabular-nums}
.val{font-size:12px;font-weight:700;fill:var(--ink);font-family:var(--sans);font-variant-numeric:tabular-nums}
.bar{fill:var(--bar)} .bar.lo{fill:var(--bar-lo)} .bar.hi{fill:var(--bar-hi)}
.hit{fill:transparent}
.mk{outline:none;cursor:default}
svg .mk:hover .bar,svg .mk:focus .bar{opacity:.72}
.teams{list-style:none}
.teams li{display:grid;grid-template-columns:42px 1fr 58px;align-items:center;gap:10px;padding:4.5px 4px;border-radius:6px;font-size:13.5px}
.teams li:hover,.teams li:focus{background:var(--acc-s)}
.tn{font-weight:600}
.tb{height:10px;display:block}
.tb i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.tv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.note{font-size:12.5px;color:var(--muted);margin-top:16px}
details{margin-top:12px;font-size:13px}
summary{cursor:pointer;color:var(--ink2);font-weight:600}
.tw{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
caption{text-align:left;font-weight:700;padding-bottom:6px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.links a{font-size:14px;font-weight:700;color:var(--acc);text-decoration:none;border-bottom:1px solid currentColor}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;list-style:none}
.feat li{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--ink2)}
.feat b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two .proj{margin:0}

.info{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;font-size:15px;max-width:640px}
.info dt{color:var(--muted);font-weight:600}
footer{border-top:1px solid var(--line);padding:26px 0 40px;font-size:13px;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;display:block}
.gc img{display:block;width:100%;aspect-ratio:8/5;object-fit:cover;object-position:top;border-bottom:1px solid var(--line);background:#fff}
.gc div{padding:11px 14px 13px}
.gc b{display:block;font-size:14.5px;line-height:1.4}
.gc span{font-size:12.5px;color:var(--muted)}
a.gc:hover{border-color:var(--acc)}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.filt button{font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.filt button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.cap{display:block;width:100%;border:1px solid var(--line);border-radius:12px;margin-top:6px}
.gh{font-size:18px;font-weight:800;margin:30px 0 12px}
.form{max-width:640px;display:grid;gap:14px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:grid;gap:6px;font-size:14px;font-weight:600}
.form input,.form select,.form textarea{font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.form textarea{min-height:160px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.form button{font:inherit;font-size:15px;font-weight:700;padding:13px 20px;border-radius:10px;border:0;background:var(--acc);color:var(--bg);cursor:pointer;justify-self:start}
.mailbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:640px;margin-bottom:26px}
.mailbox b{font-size:17px}
.mailbox button{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer}
.page{padding:48px 0 64px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:7px;opacity:0;transition:opacity .1s;white-space:nowrap}

@media (max-width:1000px){.svc{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .svc,.feat{grid-template-columns:1fr}
  .form .row{grid-template-columns:1fr}
  .gal{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .charts,.two,.tw{grid-template-columns:1fr}
  .hero{padding:40px 16px 34px}
  .in{padding:0 16px}
  nav{gap:0}
  header .in{gap:8px}
  nav a{padding:8px 6px;font-size:13px}
  .logo small{display:none}
  .proj{padding:20px}
  .info{grid-template-columns:96px 1fr}
}

.hero{padding:56px 20px 44px}
.hero h1{font-size:clamp(30px,4.8vw,48px)}
.show{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.frame{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.frame .bar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2)}
.frame .bar i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.frame .bar span{margin-left:6px}
.frame .bd{padding:14px 16px 16px;flex:1}
.frame img{display:block;width:100%;height:auto}
.frame img+img{border-top:1px solid var(--line)}
.frame .cap2{font-size:12.5px;color:var(--muted);margin-top:6px}
.iso .fl{fill:var(--line);opacity:.55}
.iso .nm{font:600 12px var(--sans);fill:var(--ink2)}
.iso .vl{font:700 11.5px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;font-variant-numeric:tabular-nums}
.isom{display:none}
.replay{font:inherit;font-size:12.5px;font-weight:700;padding:5px 11px;border:1px solid var(--ink2);background:transparent;color:var(--ink2);cursor:pointer;border-radius:0;margin-left:auto}
.tilt{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;perspective:700px}
.tilt div{border:1px solid var(--ink);padding:11px 13px;background:var(--card);box-shadow:5px 5px 0 color-mix(in srgb,var(--ink) 14%,transparent);transition:transform .12s;will-change:transform}
.tilt span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tilt b{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cap-row{display:grid;grid-template-columns:1fr 1.15fr;gap:34px;align-items:center;padding:34px 0;border-top:1px solid var(--line)}
.cap-row:first-of-type{border-top:0;padding-top:8px}
.cap-row.rev .tx{order:2}
.cap-row h3{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.35;margin:6px 0 10px}
.cap-row .step{font-size:13px;font-weight:700;color:var(--acc);letter-spacing:.04em}
.cap-row p{color:var(--ink2);font-size:15.5px}
.io{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:14px;font-size:14.5px}
.io dt{font-weight:700;color:var(--acc);white-space:nowrap}
.io dd{color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chips span{font-size:13px;font-weight:700;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.shots{display:grid;gap:10px}
.shots.two{grid-template-columns:1fr 1fr}
.shot{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);text-decoration:none}
.shot img{display:block;width:100%;aspect-ratio:8/5;object-fit:cover;object-position:top}
.shot span{display:block;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink2);border-top:1px solid var(--line)}
a.shot:hover{border-color:var(--acc)}
.cta{background:var(--acc);color:var(--bg);border-radius:18px;padding:34px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.cta h2{margin:0 0 4px;font-size:24px}
.cta p{opacity:.9;font-size:15px}
.cta .btn{border-color:transparent}
.cta .btn.p{background:var(--bg);color:var(--acc)}
.cta .btn.g{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 55%,transparent)}
@media (max-width:820px){
  .show,.cap-row{grid-template-columns:1fr}
  .cap-row.rev .tx{order:0}
  .cap-row{gap:18px;padding:26px 0}
  .tilt{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tilt b{font-size:16px}
}
@media (max-width:640px){.iso{display:none}.isom{display:block}}
.isom .tb{height:12px}
.isom .tb i{border-radius:0;box-shadow:3px 3px 0 #17504C}
.isom li:first-child .tb i{background:#D9703F;box-shadow:3px 3px 0 #A9502A}
@media (prefers-reduced-motion:reduce){.tilt div{transition:none}}
</style>
</head>

</div></header>

<main><div class="in page">
  <h2>문의</h2>
  <p class="sub">조사, 보고서 작성, 대시보드 제작 의뢰를 메일로 받습니다. 아래 양식을 채우고 보내기를 누르면 메일 작성 화면이 열립니다.</p>
  <div class="mailbox"><span>받는 주소</span><b id="addr">mjmg1325@naver.com</b><button type="button" id="copy">주소 복사</button></div>
  <form class="form" id="f">
    <div class="row">
      <label>이름<input name="name" required autocomplete="name"></label>
      <label>소속<input name="org" autocomplete="organization"></label>
    </div>
    <div class="row">
      <label>회신 연락처<input name="reply" required placeholder="메일 또는 전화번호"></label>
      <label>의뢰 유형<select name="type">
        <option>조사 설계·실사</option><option>보고서 작성(HTML·PPT·PDF·HWPX·DOCX)</option><option>정성 인터뷰 정리</option><option>통계 대시보드 제작</option><option>입체(3D) 대시보드</option><option>기타</option></select></label>
    </div>
    <label>희망 일정<input name="due" placeholder="예: 12월 둘째 주까지"></label>
    <label>의뢰 내용<textarea name="msg" required placeholder="보유 자료, 필요한 결과물 형식, 분량 등을 적어 주세요"></textarea></label>
    <button type="submit">메일 작성 화면 열기</button>
    <p class="note" id="fb" style="margin:0">메일 앱이 열리지 않으면 위 주소로 직접 보내 주세요. 첨부 자료는 메일에서 추가할 수 있습니다.</p>
  </form>
</div>
<script>
(function(){var M='mjmg1325@naver.com',f=document.getElementById('f');
f.addEventListener('submit',function(e){e.preventDefault();var d=new FormData(f);
var s='[의뢰] '+d.get('type')+' - '+d.get('name')+(d.get('org')?' ('+d.get('org')+')':'');
var b='이름: '+d.get('name')+'\n소속: '+(d.get('org')||'-')+'\n회신 연락처: '+d.get('reply')+'\n의뢰 유형: '+d.get('type')+'\n희망 일정: '+(d.get('due')||'-')+'\n\n의뢰 내용\n'+d.get('msg');
location.href='mailto:'+M+'?subject='+encodeURIComponent(s)+'&body='+encodeURIComponent(b);});
document.getElementById('copy').addEventListener('click',function(){var b=this;
(navigator.clipboard?navigator.clipboard.writeText(M):Promise.reject()).then(function(){b.textContent='복사됨'},function(){
var r=document.createRange();r.selectNode(document.getElementById('addr'));var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='선택됨'});});
})();
</script></main>

<footer><div class="in">비써치(BeSearch) · <a href="contact.html">문의</a><br>© 2026 BeSearch</div></footer>
<div id="tip" role="status"></div>
<script>
(function(){var t=document.getElementById('tip');
function show(e){var m=e.currentTarget,r=m.getBoundingClientRect();t.textContent=m.dataset.tip;t.style.opacity=1;
  var x=(e.clientX||r.left+r.width/2)+12,y=(e.clientY||r.top)-34;
  x=Math.min(x,window.innerWidth-t.offsetWidth-8);t.style.left=Math.max(8,x)+'px';t.style.top=Math.max(8,y)+'px';}
function hide(){t.style.opacity=0;}
document.querySelectorAll('.mk').forEach(function(m){var ti=m.querySelector('title');if(ti)ti.remove();
  m.addEventListener('mousemove',show);m.addEventListener('focus',show);m.addEventListener('mouseleave',hide);m.addEventListener('blur',hide);});
})();
</script>
<script>
(function(){
var D=[["삼성",23521],["LG",22222],["두산",21233],["롯데",19161],["KIA",17800],["SSG",17627],["한화",16207],["kt",14408],["키움",12820],["NC",12369]];
var svg=document.getElementById('isoS'),card=document.getElementById('isoCard'),re=document.getElementById('isoRe');
if(!svg||!window.requestAnimationFrame)return;
var c=34,ox=62,oy=196,H=168,mx=D[0][1],G=svg.querySelectorAll('g.mk'),V=svg.querySelectorAll('text.vl');
function P(x,y,z){return (ox+(x-y)*c*0.866).toFixed(1)+','+(oy+(x+y)*c*0.5-z).toFixed(1);}
function draw(t){D.forEach(function(d,i){var x0=i*1.5,x1=x0+.9,y0=0,y1=.9,k=Math.max(0,Math.min(1,t*1.6-i*0.06)),e=1-Math.pow(1-k,3),h=d[1]/mx*H*e,p=G[i].children;
 p[0].setAttribute('points',[P(x0,y1,0),P(x1,y1,0),P(x1,y1,h),P(x0,y1,h)].join(' '));
 p[1].setAttribute('points',[P(x1,y0,0),P(x1,y1,0),P(x1,y1,h),P(x1,y0,h)].join(' '));
 p[2].setAttribute('points',[P(x0,y0,h),P(x1,y0,h),P(x1,y1,h),P(x0,y1,h)].join(' '));
 var q=P(x0+.45,.45,h).split(',');V[i].setAttribute('y',(parseFloat(q[1])-12).toFixed(1));
 V[i].textContent=(k>=1?d[1]:Math.round(d[1]*e)).toLocaleString('ko-KR');});}
var run=false;function play(){if(run)return;run=true;var s=null;function step(ts){if(!s)s=ts;var t=Math.min(1,(ts-s)/1500);draw(t);if(t<1)requestAnimationFrame(step);else{draw(9);run=false;}}requestAnimationFrame(step);}
var red=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!red){re.hidden=false;re.addEventListener('click',play);
 if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){play();io.disconnect();}});},{threshold:0.35});io.observe(card);}}
